<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas grandes</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
        }
        caption{
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }
        thead{
            background-color: gray;
            color: white;
        }
        
        thead tr th{
            position: sticky;
            top: -1px;
            background-color: grey;
        }

tbody > tr:nth-child(2n){
    background-color: lightgray;
}

        td.numero{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <caption> População das unidades federativas</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 50px;">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="numero">46 081 801</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="numero">21 393 441</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="numero">17 223 547</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="numero">14 870 907</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="numero">11 890 517</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="numero">11 233 264</td>
            </tr>
            <tr>
                <td>Pernambuco</td>
                <td class="numero">9 562 007</td>
            </tr>
            <tr>
                <td>Ceará</td>
                <td class="numero">9 268 836</td>
            </tr>
            <tr>
                <td>Pará</td>
                <td class="numero">8 711 196</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total de habitantes</th>
                <td class="numero"><strong>213 421 037</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
