<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Mude o tamanho do navegador ou mude o aparelho pra abrir o site</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel grande">
    </picture>

    <h1>Reproduzir audio</h1>
    <p>vamos aprender a reproduzir audio</p>
    <audio preload="metadata" controls>
        <source src="midia/nebula.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <p>Infelizmente seu navegador nao pode reproduzir audio</p>
    </audio>

    <h1>Vídeos inseridos localmente</h1>
    <p>video esta hospedado no meu proprio servidor</p>
    <video width="560" poster="../Desafios/d005/favicon.png" controls>
        <source src="midia/clip.mp4" type="video/mp4">
    </video>

    <h1>Vídeos inseridos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/DfloaXUKr2o?si=5J1HKUOjZZTPMrYG" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <!--Videos do youtube nao sao compativeis com abrir o index localmente, baixei a extensao do live server pra funcionar ou usar um servidor/site de verdade-->
    
</body>
</html>
